spring.application.name=chatbot_fptu

# Load .env file if present (for local development)
spring.config.import=optional:file:.env

# ===============================================
# C?U H�NH K?T N?I DATABASE SUPABASE (POSTGRESQL)
# ===============================================

# C�c gi� tr? n�y gi? ???c ??c t? file .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Các cấu hình khác giữ nguyên
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================================
# C?U H�NH GOOGLE OAUTH2
# ==================================
# C�c gi� tr? n�y gi? ???c ??c t? file .env
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Scope gi? nguy�n
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ==================================
# C?U H�NH JWT
# ==================================
jwt.secret=${JWT_SECRET}

# ==================================
# MULTI-AGENT API CONFIG (thay thế N8N)
# ==================================
# URL của Multi-Agent FastAPI server (mặc định chạy trên port 8000)
multiagent.api.url=${MULTIAGENT_API_URL:http://127.0.0.1:8000}

# ==================================
# N8N CONFIG (ĐÃ XÓA - không còn sử dụng)
# ==================================
# n8n.webhook.url=${N8N_WEBHOOK_URL}

# ==================================
# C?U H�NH G?I EMAIL
# ==================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==================================
# LOGGING CONFIG
# ==================================
logging.level.com.tuatua=DEBUG
logging.level.org.springframework.security=DEBUG